name: Flutter desktop CI

on:
  push:
    tags: ['release-*']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  verify:
    name: Verify (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-14
            target: macos
            macos_arch: arm64
          - os: windows-latest
            target: windows
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release commit
        if: github.event_name == 'push'
        shell: bash
        run: |
          subject="$(git log -1 --format=%s)"
          [[ "$subject" == release\(*\):* ]]
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.target }}-desktop
      - name: Check macOS runner architecture
        if: matrix.target == 'macos'
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.macos_arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          echo "Building macOS $EXPECTED_ARCH on $(sw_vers -productVersion)."
      - name: Check toolchain
        run: |
          flutter --version
          dart --version
          git --version
      - name: Install Dart dependencies
        run: flutter pub get
      - name: Run formatter, analyzer, and tests
        run: dart run tool/verify.dart

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            bundle_path: build/linux/x64/release/bundle
            artifact_name: spull-linux-x86_64
            asset_name: spull-linux-x86_64.tar.gz
          - os: macos-14
            target: macos
            macos_arch: arm64
            bundle_path: build/macos/Build/Products/Release/spull.app
            artifact_name: spull-macos-universal
            asset_name: spull-macos-universal.app.zip
          - os: windows-latest
            target: windows
            bundle_path: build/windows/x64/runner/Release
            artifact_name: spull-windows-x86_64
            asset_name: spull-windows-x86_64.zip
            setup_asset_name: spull-windows-x86_64-setup.zip
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev
      - name: Enable desktop target
        run: flutter config --enable-${{ matrix.target }}-desktop
      - name: Install Dart dependencies
        run: flutter pub get
      - name: Build release bundle
        run: flutter clean && flutter build ${{ matrix.target }} --release
      - name: Verify complete release bundle
        run: dart run tool/verify_desktop_artifact.dart ${{ matrix.target }}
      - name: Check macOS runner architecture
        if: matrix.target == 'macos'
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.macos_arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          echo "Building macOS $EXPECTED_ARCH on $(sw_vers -productVersion)."
      - name: Verify macOS architecture and unsigned bundle
        if: matrix.target == 'macos'
        shell: bash
        env:
          BUNDLE_PATH: ${{ matrix.bundle_path }}
        run: |
          executable="$BUNDLE_PATH/Contents/MacOS/spull"
          archs="$(lipo -archs "$executable")"
          case " $archs " in
            *" arm64 "*) ;;
            *) echo "The macOS bundle is missing arm64."; exit 1 ;;
          esac
          case " $archs " in
            *" x86_64 "*) ;;
            *) echo "The macOS bundle is missing x86_64."; exit 1 ;;
          esac
          test ! -d "$BUNDLE_PATH/Contents/_CodeSignature"
          if codesign --verify --deep --strict "$BUNDLE_PATH" >/dev/null 2>&1; then
            echo "The macOS bundle is signed; expected an unsigned release."
            exit 1
          fi
      - name: Package release bundle
        if: github.event_name == 'push' && matrix.target != 'windows'
        shell: bash
        env:
          ARTIFACT_PATH: ${{ matrix.bundle_path }}
          ASSET_NAME: ${{ matrix.asset_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release-assets
          case "$TARGET" in
            macos)
              staging_directory="$(mktemp -d)"
              package_name="${ASSET_NAME%.app.zip}"
              package_directory="$staging_directory/$package_name"
              mkdir -p "$package_directory"
              ditto "$ARTIFACT_PATH" "$package_directory/spull.app"
              cp tool/Run-Spull.command "$package_directory/Run-Spull.command"
              chmod +x "$package_directory/Run-Spull.command"
              ditto -c -k --sequesterRsrc --keepParent \
                "$package_directory" "release-assets/$ASSET_NAME"
              rm -rf "$staging_directory"
              ;;
            linux)
              tar -czf "release-assets/$ASSET_NAME" -C "$ARTIFACT_PATH" .
              ;;
          esac
      - name: Package Windows release bundles
        if: github.event_name == 'push' && matrix.target == 'windows'
        shell: pwsh
        run: .\tool\package_windows_release.ps1 -ReleaseDirectory '${{ matrix.bundle_path }}' -OutputDirectory release-assets
      - name: Upload release package
        if: github.event_name == 'push' && matrix.target != 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.artifact_name }}
          path: release-assets/${{ matrix.asset_name }}
          if-no-files-found: error
      - name: Upload Windows release packages
        if: github.event_name == 'push' && matrix.target == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.artifact_name }}
          path: |
            release-assets/${{ matrix.asset_name }}
            release-assets/${{ matrix.setup_asset_name }}
          if-no-files-found: error
      - name: Upload complete desktop bundle
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download release packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Validate package count
        shell: bash
        run: |
          assets=(release-assets/*)
          test "${#assets[@]}" -eq 4
          test -f release-assets/spull-linux-x86_64.tar.gz
          test -f release-assets/spull-macos-universal.app.zip
          test -f release-assets/spull-windows-x86_64.zip
          test -f release-assets/spull-windows-x86_64-setup.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=(release-assets/*)
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
            --verify-tag \
            --title "Spull ${GITHUB_REF_NAME#release-}" \
            --generate-notes
